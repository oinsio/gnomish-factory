# The image contract: the one source of the values the sandbox base image and the factory share
# (FR6, design D2 of add-sandbox-base-image). The image build reads them into build arguments;
# the `:sandbox:docker` build copies this file into its resources, where `ImageContract` reads it.
# Neither the Dockerfile nor any Java source spells these values. Raising `contract-version`
# changes the base's `io.gnomish.image-contract` label and the version the factory requires.
contract-version=1
guard-alias=gnomish-guard
guard-port=8080
