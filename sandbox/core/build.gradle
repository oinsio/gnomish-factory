// Build script for the `:sandbox:core` module (FR8, design D7/D11 of
// split-into-modules): the sandbox PORT layer — the `TaskExecutionEnvironment`
// port and its value model, the capability-passport negotiation
// (CapabilityPassport / SandboxNeed / SandboxReconciler / AdapterBinding /
// BindingResolver) and the typed `factory.sandbox.*` / `factory.bindings.*`
// configuration.
//
// It is a first-party port module, not an adapter (D11): `:application` depends
// on it, backends implement it. Nothing backend-specific may land here — no
// docker-CLI mechanics, no testcontainers, no backend SDK — which is exactly the
// property the split buys by construction. The backends live in
// `:sandbox:docker` (task 6.1).
plugins {
    id 'library-conventions'
    // The FR2 direction gate (task 5.2); the permitted reach is stated below.
    id 'layering-conventions'
}

description = 'Sandbox port layer: the TaskExecutionEnvironment port, capability-passport negotiation, and typed sandbox configuration.'

dependencies {
    // Version management only (no artifacts), as in `:domain`: the Boot BOM pins
    // the spring-boot version used below (design D3 of add-project-skeleton).
    implementation platform(libs.spring.boot.dependencies)

    // `api`, not `implementation`: the port's own signatures are typed in
    // `:domain` value types — `Sandbox` (SandboxReconciler) and `Clock`
    // (ExecHandle.waitForExitOrTimeout) — so every consumer of this module
    // compiles against them too.
    api project(':domain')

    // `ChildEnvAllowlist` logs the credential names it redacts through the SLF4J
    // API directly; the backend is the composition root's choice (design D3 of
    // add-project-skeleton), and `:domain` declares slf4j as `implementation`,
    // so it is not inherited transitively.
    implementation libs.slf4j.api

    // The untrusted-text leaf (FR1, design D3 of type-untrusted-text): `CapturedExec`
    // carries an in-box command's output as `UntrustedText` and mints it at the box
    // boundary. `api`, not `implementation`: the carrier is on this port layer's own
    // public surface, so every consumer compiles against it too.
    api project(':untrustedtext')

    // The subprocess leaf (design D9 of bound-subprocess-commands: dependency-free, so the reach it
    // adds is nil): `CapturedExec` reads an exec handle's output on its `Drain`, joined with the
    // handle's post-exit bound, and judges a cut through `CutCaptureException.refuses` (design D15,
    // D17 of fix-terminal-receipt-convergence). `api`, not `implementation`: `ExecHandle.output()`
    // returns its `ChildOutput` (design D1 of make-pipe-reads-non-parking), so every consumer of the
    // port compiles against it too.
    api project(':subprocess')

    // @ConfigurationProperties / @Name on the three configuration records
    // (design D1's layer-home rule: root config-properties types follow their
    // consumers). The bare `spring-boot` artifact, not the starter: this module
    // needs the annotations only, never a running context — that is
    // `:bootstrap`'s concern (design D3).
    implementation libs.spring.boot.asProvider()

    // The operator-configuration level leaf (FR6, design D4 of add-project-registry): every
    // component of the three configuration records declares its key's level with
    // `@ConfigLevel`. JDK-only, so the port layer stays free of anything new. `api`, not
    // `implementation`: the annotation is runtime-retained on the records' public components, so
    // every module compiling against them needs its class, or javac reports its constants unknown.
    api project(':operatorconfig')

    // The capture specs' `CannedExecHandle` mints its `ChildOutput` from the one `Process` double,
    // `FakeProcess` (design D6 of make-pipe-reads-non-parking): a stream double can no longer be
    // handed to the port.
    testImplementation project(':test-fixtures')
}

// The sandbox PORT layer sits directly above the domain (FR2, design D11): it
// must never reach `:application`, an adapter, a sandbox backend, or the
// composition root.
layering {
    allowedProjects = [
        ':domain',
        // The operator-configuration level leaf (design D4 of add-project-registry): declared
        // directly above — the configuration records carry `@ConfigLevel`.
        ':operatorconfig',
        // The operator-event catalog leaf (FR11, design D9 of split-logtext-leaves): transitive
        // via `:domain`, whose engine emitters take their `[GFnnn]` head from it. No production
        // source in this module names it; the layering gate walks the transitive graph, so the
        // reach is listed where it arrives.
        ':operatorevent',
        // The subprocess leaf (design D9 of bound-subprocess-commands; D17 of
        // fix-terminal-receipt-convergence): declared directly above — `CapturedExec` joins its
        // drain on it. Dependency-free, so this edge reaches nothing further.
        ':subprocess',
        // The untrusted-text leaf (FR11, design D9 of split-logtext-leaves; FR1, design D3
        // of type-untrusted-text): declared directly above — `CapturedExec.output` is a
        // carrier, so this module's own signatures name it.
        ':untrustedtext',
    ]
}

// `:operatorconfig` is exported as `api` although DAGP advises `implementation`: its ABI reading
// does not count a runtime-retained annotation on a public record component as surface, while
// javac does — a module compiling against these records without the leaf reports each
// `@ConfigLevel(Level.X)` as an "unknown enum constant" (design D4 of add-project-registry).
// Excluded for that one edge only; every other configuration advice here still fails the build.
dependencyAnalysis {
    issues {
        onIncorrectConfiguration {
            exclude(':operatorconfig')
        }
    }
}
