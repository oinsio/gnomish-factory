// Why `:bootstrap` pins versions its code never names: the advisory forces on this module's
// dependency classpaths. Split out of `bootstrap/build.gradle` to keep that file within the
// project file-size cap (FR6, M2, task 9.2 of split-into-modules) — the build file states what
// this module *is* (its plugins, module edges and libraries), `verification.gradle` states how it
// is *checked*, and this one states which versions are forced away from what a BOM would resolve,
// and which advisory forced each. A module-local script plugin rather than a `build-logic`
// convention plugin: the set is this module's own, because it is the module that packages the
// application and so carries the runtime stack the OSV gate scans.
//
// Not here, and deliberately: the `buildscript` classpath forces at the top of `build.gradle`.
// That block configures the script's OWN plugin classpath and must be evaluated before `plugins`,
// which is before any `apply from:` can run — so it cannot move without ceasing to work.
//
// Also not here: the httpclient5 / httpcore5(-h2) test-classpath overrides, which moved to
// `test-conventions` (D3 of fix-osv-dependency-gate) because more than one module needs them.
//
// Every entry is one of two kinds, and says which: a PIN (the version is forced to a fixed
// release) or an ACCEPTED RISK recorded in `osv-scanner.toml`. Production scope is always pinned,
// never suppressed (NFR-S1, D4 of fix-osv-dependency-gate).
dependencies {
    // PIN, production and test: the Jackson BOM at the CVE-fixed version (GHSA-5jmj-h7xm-6q6v,
    // see libs.versions.toml). Boot 4.1.0 imports jackson-bom 2.21.4 transitively; declaring
    // 2.22.1 here wins by Gradle's highest-version conflict resolution and bumps the whole family
    // at once. Drop once a Boot 4.1.x upgrade manages 2.22.1+.
    implementation platform(libs.jackson.bom)

    // PIN, production: the logging stack spring-boot-starter pulls in — logback (BOM-pinned
    // 1.5.34) to GHSA-jhq6-gfmj-v8fx's fix, and the log4j pair (BOM-pinned 2.25.4) to
    // GHSA-qv9r-c865-cp47's. Each pair must move together. The log4j one is this build's only
    // PRODUCTION-scope advisory — `log4j-to-slf4j` is Boot's logging bridge, on runtimeClasspath.
    constraints {
        implementation libs.logback.core
        implementation libs.logback.classic
        implementation libs.log4j.api
        implementation libs.log4j.to.slf4j
    }

    // PIN, test only: WireMock 3.13.1's HttpServerFactoryLoader needs an internally consistent
    // Jetty 11 stack (its own jetty-bom import); the Boot 4.1.0 BOM otherwise wins conflict
    // resolution on jetty-server/-http/-io/etc. while jetty-servlet/-webapp (which Boot does not
    // manage) stay on 11 — the mixed 11/12 classpath then fails at WireMockServer startup with
    // "Jetty 11 is not present" (task 4.4). enforcedPlatform (not platform) forces every
    // jetty-bom-managed version to the pinned Jetty 11 line on the test classpaths. The version
    // lives in the catalog ([versions].jetty); it clears GHSA-mmxm-8w33-wc4h (http2-common), and
    // the residual Jetty 11 advisories are test-scope only — see osv-scanner.toml.
    testImplementation enforcedPlatform(libs.jetty.bom)

    // ACCEPTED RISK, test only: handlebars (GHSA-r4gv-qr8j-p3pg) cannot be bumped — its only fix,
    // 4.5.2, drops com.github.jknack.handlebars.helper.NumberHelper, which WireMock 3.13.1 loads
    // at startup (NoClassDefFoundError). Templates are developer-authored, so it stands until
    // WireMock 4.x — see osv-scanner.toml.
}
