purpose: do the work and pass three kinds of quality control
inputs:
  - kind: source
outputs:
  - id: work-diff
executor:
  type: agent-cli
  model: work-model
  settings:
    maxTurns: 10
instructions: stages/work/instructions.md
verify:
  - type: builtin
    name: files_exist
    params:
      files:
        - marker.txt
  - type: command
    command: test -f attempt-marker.txt && exit 0 || { touch attempt-marker.txt; exit 1; }
  - type: judge
    criteriaFile: stages/work/acceptance.md
    executor:
      type: agent-cli
      model: judge-model
      settings:
        maxTurns: 3
advancement: manual
