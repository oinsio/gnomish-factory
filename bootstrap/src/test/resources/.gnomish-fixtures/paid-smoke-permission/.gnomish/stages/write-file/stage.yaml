purpose: one real executor round that must edit a file, then one real judge vote invited to start a sub-agent (task 6.2 of fix-operator-blockers)
inputs:
  - kind: source
outputs:
  - id: hello-file
executor:
  type: agent-cli
  model: haiku
  settings:
    allowedTools:
      - Read
      - Write
      - Edit
    maxTurns: 5
    roundTimeout: 50s
instructions: stages/write-file/instructions.md
verify:
  - type: judge
    criteriaFile: stages/write-file/acceptance.md
    model: haiku
    settings:
      maxTurns: 6
      roundTimeout: 50s
    votes: 1
advancement: auto
