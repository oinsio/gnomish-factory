// How `:bootstrap` verifies itself: the `test` task's E2E wiring, this module's
// mutation scope, and the two manual layers that run outside `check`. Split out
// of `bootstrap/build.gradle` to keep that file within the project file-size cap
// (FR6, M2, task 9.2 of split-into-modules) — the build file states what this
// module *is* (its plugins, dependencies and permitted reach), this one states
// how it is *checked*. A module-local script plugin rather than a `build-logic`
// convention plugin: nothing here is shared — `build-logic` is for configuration
// more than one module applies.

// Test-task wiring specific to this module's E2E layers; the shared
// useJUnitPlatform / heap / JaCoCo configuration comes from `test-conventions`.
tasks.named('test') {
    // E2E layer (task 9.1 of add-manual-run, M1): E2eProcessHarness spawns
    // `gnomish run` as a real process via `java -jar`, so the executable jar must
    // exist before any E2E spec runs, and `e2e.jarPath` is the harness's sole way
    // to locate it — no build/libs/*.jar glob that could match a stale artifact.
    // The cost for non-E2E runs is negligible: bootJar only repackages what is
    // already compiled.
    dependsOn tasks.named('bootJar')
    systemProperty 'e2e.jarPath', tasks.named('bootJar').get().archiveFile.get().asFile.absolutePath

    // The fake agent's script and scenario library live in `:test-fixtures` but
    // are resolved from disk, not the classpath: they reach a consumer inside a
    // jar, and neither `sh <path>` nor a scenarios-directory walk can work
    // against a `jar:` URI. Same idiom as `referenceDumpDir` in `:adapters`.
    systemProperty 'fakeAgentDir', rootProject.file('test-fixtures/src/main/resources/fake-agent').absolutePath

    // `SecretsPortBoundarySpec` walks every module's build metadata asserting no credential name
    // reaches it (NFR-S1, task 5.5), and `ModuleBuildFileSpec` measures those same files against
    // the project's size cap (FR6, M2, task 9.2). The whole-tree gates live in this module because
    // it is the one that sees every layer at once; the build files are the same kind of whole-tree
    // subject. They are a real input of this task: without declaring them, editing a build script
    // leaves `test` up to date and the gates simply do not run.
    systemProperty 'repoRoot', rootProject.projectDir.absolutePath
    inputs.files(rootProject.fileTree(rootProject.projectDir) {
        include '**/*.gradle', '**/*.lockfile', '**/gradle.properties', 'gradle/libs.versions.toml'
        exclude '**/build/**', '**/.git/**', '**/.gradle/**'
    }).withPropertyName('buildMetadata')

    // The Ollama E2E layer (task 11.1) needs a native local Ollama install and a logged-in
    // `claude` CLI, and the paid smoke layer (task 11.3) spends real money against the real
    // Anthropic backend by design. Both are excluded here and run only via their dedicated tasks
    // below, so `./gradlew build`/`check` never requires Ollama nor spends a cent.
    exclude 'com/github/oinsio/gnomish/e2e/ollama/**'
    exclude 'com/github/oinsio/gnomish/e2e/paidsmoke/**'
}

// PIT exclusions documented for THIS module; the engine configuration
// (versions, threads, this module's own targetClasses, thresholds, timeout
// budget, the pitestVerifyAllKilled fail-closed gate) lives in
// `pitest-conventions`, and the two exemption categories and their bars in
// `.claude/rules/testing.md`. Task 8.1 bound each module's mutation scope to its
// own production packages, so exclusions naming classes and specs owned by
// `:adapters` and `:application` live in those modules' build files.
pitest {
    // PIT's minions are separate JVM launches that inherit nothing from the `test` task, so the
    // two deterministic on-disk locations are handed to them explicitly (see the rules file):
    // `fakeAgentDir` for the fake-agent suites, `repoRoot` for SecretsPortBoundarySpec's
    // credential-name scan. `e2e.jarPath` is deliberately NOT supplied — those specs spawn the
    // packaged jar per mutant, which is what the `e2e.*` exclusion below is for.
    jvmArgs = [
        "-DfakeAgentDir=${rootProject.file('test-fixtures/src/main/resources/fake-agent').absolutePath}".toString(),
        "-DrepoRoot=${rootProject.projectDir.absolutePath}".toString(),
    ]
    // FR6 documented exception: the application bootstrap class is only
    // main() + SpringApplication.run(), unreachable by unit tests by design
    // (design D5, D10). Everything else must reach 100%.
    excludedClasses = [
        'com.github.oinsio.gnomish.FactoryApplication',
    ]
    // Out-of-process suites, per `.claude/rules/testing.md` ("Excluded test classes"). Each
    // removes no production line from mutation coverage — every class they exercise also has fast,
    // in-process unit specs feeding the gate.
    excludedTestClasses = [
        // Spawn the packaged jar via `java -jar`, reading `e2e.jarPath`, which only the `test`
        // task wires from the bootJar output (M1/M4; task 9.1 of add-manual-run, and
        // FactoryApplicationSpec's "bootJar stays headless" feature, task 6.5 of add-tracker-port).
        'com.github.oinsio.gnomish.e2e.*',
        'com.github.oinsio.gnomish.FactoryApplicationSpec',
        // Drive a real Docker daemon — real containers, volumes, networks — and a real Gitea
        // remote through subprocess `docker`/`git` (add-sandbox-core tasks 4.5-9.4). The sibling
        // suites of this family live in `:adapters` and are excluded by that module (task 8.1).
        'com.github.oinsio.gnomish.app.ContainerModePipelineE2ESpec',
        'com.github.oinsio.gnomish.app.ContainerModeIsolationE2ESpec',
        'com.github.oinsio.gnomish.app.ContainerModeResumeE2ESpec',
    ]
}

// Ollama E2E harness (task 11.1, M1, D11): real `claude` CLI pointed at a local Ollama instance
// (native Anthropic API since Ollama v0.14 — no shim/proxy needed, just `ANTHROPIC_BASE_URL`).
// Dockerized Ollama has no Metal access on macOS and is unusably slow, so this targets a native
// dev-machine install, not Testcontainers (D11). Individual specs under `e2e.ollama` skip
// themselves cleanly via `OllamaAvailability` (Spock `@IgnoreIf`) when Ollama or the `claude` CLI
// is absent — this task itself always "succeeds" (0 or more skipped tests), so CI can run it
// opportunistically without a hard Ollama requirement.
tasks.register('ollamaE2eTest', Test) {
    description = 'Runs the Ollama-backed local E2E specs (real claude CLI + local Ollama); skips cleanly when Ollama is absent.'
    group = 'verification'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include 'com/github/oinsio/gnomish/e2e/ollama/**'
    dependsOn tasks.named('bootJar')
    systemProperty 'e2e.jarPath', tasks.named('bootJar').get().archiveFile.get().asFile.absolutePath
    // Always show individual outcomes (PASSED/SKIPPED) so a developer can see the skip-with-reason
    // message from OllamaAvailability/@IgnoreIf directly in the console, not just an aggregate count.
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = false
    }
}

// Paid smoke task (task 11.3, M4, D11's "(3b) Paid smoke"): real `claude` CLI against the real
// Anthropic backend (a logged-in, authenticated CLI — not Ollama, which OllamaAvailability's
// weaker "resolves on PATH" check is enough for since Ollama never validates the auth token).
// Never wired into CI: this task spends real money by design (M4).
// `PaidSmokeReferenceDumpSpec`'s login preflight fails each recording feature fast with a specific
// reason (not authenticated, binary missing, hung on an interactive login prompt) rather than
// hanging — see ClaudeLoginPreflight. Run manually on CLI version bumps, parser changes,
// unexplained divergence between this layer and the fake-agent/Ollama layers, and before archiving
// a change; its dumps refresh the committed stream-json reference fixtures.
tasks.register('paidSmokeTest', Test) {
    description = 'Manual, paid smoke test against the real claude CLI backend; refreshes stream-json reference dumps. Never run in CI.'
    group = 'verification'
    useJUnitPlatform()
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include 'com/github/oinsio/gnomish/e2e/paidsmoke/**'
    // The committed reference dumps moved to `:adapters` with the stream-json parser (task 5.1);
    // this layer records into them, so it resolves the on-disk source resource directory there
    // (not a build/resources copy) — the same on-disk-vs-copy distinction e2e.jarPath draws for
    // the bootJar artifact.
    systemProperty 'referenceDumpDir', rootProject.file('adapters/src/test/resources/stream-json-reference').absolutePath
    // Test tasks fork a separate JVM, so a `-D` on the Gradle command line never reaches it on its
    // own — this project property (`-PpaidSmoke.claudeBinary=...`) is explicitly forwarded as the
    // forked JVM's system property of the same name, the seam PaidSmokeReferenceDumpSpec/
    // ClaudeLoginPreflight read the CLI binary override from (defaults to `claude` on PATH).
    if (project.hasProperty('paidSmoke.claudeBinary')) {
        systemProperty 'paidSmoke.claudeBinary', project.property('paidSmoke.claudeBinary')
    }
    testLogging {
        events 'passed', 'skipped', 'failed'
        // Unlike ollamaE2eTest's clean-skip convention, a login-preflight failure here must be
        // immediately visible on the console — this task runs manually and a hidden failure reason
        // could read as a hang or an opaque red X instead of "run `claude login` and retry."
        exceptionFormat = 'full'
        showExceptions = true
        showCauses = true
        showStandardStreams = true
    }
}
