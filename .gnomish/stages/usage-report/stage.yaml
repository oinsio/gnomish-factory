purpose: post the task's wall time and tokens per stage and per model, deliver included, as one comment on its pull request, so the reviewer sees what the change cost
inputs:
  - kind: source
  - kind: internal
    producerOutputId: pull-request
# The whole work is report.sh beside this manifest: it renders `gnomish usage --json` and
# creates or edits one marked comment on the open pull request. No gnome counts anything.
# The comment goes to the pull request, not the issue: the factory reads every plain comment
# in the issue thread after its last ack as a human's decision (GithubDecisions), so a
# report there could be taken for an answer if the task were ever parked again.
#
# Until the factory has a command executor (the add-command-executor change), a stage needs
# an agent round, so the cheapest model runs the one script and stops. Once that change lands,
# this executor becomes `type: command` running report.sh and the round costs nothing.
#
# The stage is last, after deliver, so deliver's own rounds are in the report; only this
# stage's round is not.
outputs:
  - id: usage-report
executor:
  type: agent-cli
  model: claude-haiku-4-5-20251001
  settings:
    maxTurns: 5
    roundTimeout: 300s
    allowedTools:
      - Bash
    disallowedTools:
      - Agent
      - Edit
      - Write
      - Read
      - Glob
      - Grep
      - ScheduleWakeup
      - SendMessage
      - ToolSearch
      - WebFetch
      - WebSearch
instructions: stages/usage-report/instructions.md
verify:
  # The report is on the pull request. A failed GitHub query exits 126: "cannot verify", an
  # infrastructure failure that burns no attempt.
  - type: command
    command: |
      branch=$(git branch --show-current)
      marker='<!-- gnomish:usage-report -->'
      if ! number=$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number // empty' 2>&1); then
        echo "cannot verify: gh pr list failed: $number"
        exit 126
      fi
      [ -n "$number" ] || { echo "no open pull request from $branch into main - the deliver stage opens it"; exit 1; }
      if ! found=$(gh api "repos/{owner}/{repo}/issues/$number/comments" --paginate \
          --jq ".[] | select(.body | startswith(\"$marker\")) | .body" 2>&1); then
        echo "cannot verify: listing the comments of pull request #$number failed: $found"
        exit 126
      fi
      if ! printf '%s\n' "$found" | grep -qx '## Factory usage'; then
        echo "pull request #$number has no usage report - run .gnomish/stages/usage-report/report.sh"
        exit 1
      fi
  - type: command
    command: |
      stray=$(git status --porcelain --untracked-files=all | sed 's/^...//' | grep -v '^\.gnomish-task/' || true)
      if [ -n "$stray" ]; then
        echo "this stage changes no file of the repository, but the working copy carries:"
        echo "$stray"
        exit 1
      fi
advancement: auto
autonomy:
  attemptLimit: 2
