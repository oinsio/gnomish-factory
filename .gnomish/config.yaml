# Pipeline configuration for developing the factory with the factory itself.
#
# A task names an existing OpenSpec change. The pipeline grows one stage at a
# time while the setup is being debugged: first whether the change can start
# now (check-dependencies), then how much of it still holds against what has
# landed since it was written (review-artifacts), then the change revised from
# that review, every recommendation applied or rejected with evidence
# (fix-artifacts), then the change implemented task by task until
# ./gradlew check is green (implement).
schemaVersion: "1"

autonomy:
  attemptLimit: 2

tracker:
  type: github
  abort-threshold: 3
  heartbeat-interval: 5m
  heartbeat-ttl-multiplier: 3
  github:
    api-url: https://api.github.com
    repo: oinsio/gnomish-factory
