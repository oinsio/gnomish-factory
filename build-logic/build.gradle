// Build for the convention-plugin sources (FR6, design D9 of split-into-modules).
// Each `src/main/groovy/*.gradle` file becomes a plugin whose id is the file
// name, applied by the modules of the main build.
plugins {
    id 'groovy-gradle-plugin'
}

// The CVE overrides for the plugin transitives stay in the root buildscript
// block: applying a plugin from a precompiled script plugin still puts its jar
// on the consuming build's buildscript classpath, so `buildscript-gradle.lockfile`
// is unchanged by this split and the root `force` entries keep guarding those
// same artifacts (verified: the lockfile still lists them).
//
// Same reproducibility / OSV-Scanner posture as the main build: the resolved
// plugin versions are pinned in a committed lockfile that OSV-Scanner reads.
dependencyLocking {
    lockAllConfigurations()
}

// A plugin applied from a precompiled script plugin must be on this build's
// implementation classpath, declared by its marker coordinates. `pluginId` and
// `version` come from the shared catalog so no version is written twice.
def marker = { Provider<PluginDependency> alias ->
    def plugin = alias.get()
    "${plugin.pluginId}:${plugin.pluginId}.gradle.plugin:${plugin.version.requiredVersion}"
}

dependencies {
    implementation marker(libs.plugins.spotless)
    implementation marker(libs.plugins.errorprone)
    implementation marker(libs.plugins.pitest)
    implementation marker(libs.plugins.japicmp)
    implementation marker(libs.plugins.license.report)
    implementation marker(libs.plugins.cyclonedx)
}

// --- Functional (TestKit) verification of the convention plugins ---
//
// FR1/FR9, design D2 of add-functional-api-gate-test: the api-compatibility gate
// is verified by RUNNING it — a miniature project built by `GradleRunner`,
// against its own generated baseline — not by matching the text of the
// convention script. The suite lives here because `gradlePlugin.testSourceSets`
// only generates the plugin-classpath manifest for source sets of the project
// that owns the plugins.
testing {
    suites {
        functionalTest(JvmTestSuite) {
            useJUnitJupiter() // Spock 2 runs on the JUnit Platform
            dependencies {
                implementation gradleTestKit()
                implementation libs.groovy
                implementation libs.spock.core
                runtimeOnly libs.junit.platform.launcher
            }
        }
    }
}

// Injects the precompiled convention plugins into `withPluginClasspath()` builds.
gradlePlugin {
    testSourceSets sourceSets.functionalTest
}

tasks.named('check') {
    dependsOn testing.suites.named('functionalTest')
}

// --- Hermeticity of the TestKit fixture (NFR-R1) ---
//
// `JapicmpTask` resolves its worker's JAXB and Guava runtime from the CONSUMING
// project's repositories, at execution time, from coordinates hardcoded in the
// plugin (`resolveJaxb` / `resolveGuava`, 0.4.6) — the plugin classpath TestKit
// injects does not cover them and no task property overrides them. So the mini
// project declares `mavenCentral()` and every fixture build runs `--offline`
// against THIS build's Gradle user home (passed through as a system property
// and given to the runner with `-g`): the artifacts are already in that cache
// because resolving them below is an input of the `functionalTest` task.
// Nothing is fetched while a scenario runs, so the suite cannot flake on the
// network.
//
// Deliberately unlocked: these are the japicmp plugin's own internal worker
// coordinates, not dependencies of this build's code. Locking them would list
// versions we do not choose and cannot bump in a file that reads as our
// dependency set (and that OSV-Scanner reads as such); in the main build the
// very same artifacts are resolved by the very same plugin, unlocked, on every
// `japicmpApiGate` run.
configurations.register('japicmpWorkerRuntime') {
    canBeConsumed = false
    canBeResolved = true
    resolutionStrategy.deactivateDependencyLocking()
}

dependencies {
    japicmpWorkerRuntime 'javax.xml.bind:jaxb-api:2.3.1'
    japicmpWorkerRuntime 'com.sun.xml.bind:jaxb-core:4.0.9'
    japicmpWorkerRuntime 'com.sun.xml.bind:jaxb-impl:4.0.9'
    japicmpWorkerRuntime 'javax.activation:activation:1.1.1'
    japicmpWorkerRuntime 'com.google.guava:guava:33.7.2-jre'
}

tasks.named('functionalTest') {
    inputs.files(configurations.named('japicmpWorkerRuntime'))
            .withPropertyName('japicmpWorkerRuntime')
            .withNormalizer(ClasspathNormalizer)
    systemProperty 'gnomish.gradleUserHome', gradle.gradleUserHomeDir.absolutePath
}

// FR8 of add-project-license: the license-gate scenarios run against the
// repository's OWN allowlist, not a copy written for the test, so a rule the real
// file drops or a canonical name the plugin's bundle renames turns them red.
def allowedLicenses = layout.projectDirectory.file('../config/allowed-licenses.json')
tasks.named('functionalTest') {
    inputs.file(allowedLicenses).withPropertyName('allowedLicenses').withPathSensitivity(PathSensitivity.NONE)
    systemProperty 'gnomish.allowedLicensesFile', allowedLicenses.asFile.absolutePath
}

// NFR-R1, design D10 of add-parameter-count-gate: the parameter-count wiring scenario
// applies `java-conventions` to a miniature project whose settings `includeBuild` the
// REAL `build-checks` directory, so the check the mini build compiles under is the one the
// main build ships — not a copy. `java-conventions` reads the `libs` catalog, so the mini
// settings import the repository's own catalog file too. Both are inputs: a change to the
// check's source or to a pinned version re-runs the scenario.
def buildChecksDir = layout.projectDirectory.dir('../build-checks')
def versionCatalog = layout.projectDirectory.file('../gradle/libs.versions.toml')
tasks.named('functionalTest') {
    inputs.files(fileTree(buildChecksDir) { include '**/src/main/**', '**/*.gradle', '**/*.lockfile' })
            .withPropertyName('buildChecksSources')
            .withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.file(versionCatalog).withPropertyName('versionCatalog').withPathSensitivity(PathSensitivity.NONE)
    systemProperty 'gnomish.buildChecksDir', buildChecksDir.asFile.absolutePath
    systemProperty 'gnomish.versionCatalog', versionCatalog.asFile.absolutePath
}
