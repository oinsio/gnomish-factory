// Conventions for a module published as a third-party contract artifact
// (FR5, FR6, design D9/D10 of split-into-modules). Applied by
// `:gnomish-plugin-api` in task 2.5.
//
// What it buys over `library-conventions`: a Maven publication with sources and
// javadoc (a third party compiles and reads against it, UX3) and a build-time
// assertion that the module carries a real semver version — the version is the
// compatibility promise FR5 makes, so a placeholder must not ship.
plugins {
    id 'library-conventions'
    id 'maven-publish'
    id 'me.champeau.gradle.japicmp'
}

java {
    // A contract artifact is read, not just linked: ship the sources and the
    // javadoc a third-party adapter author needs (UX3).
    withSourcesJar()
    withJavadocJar()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            pom {
                name = project.name
                description = project.description ?: 'Gnomish Factory published API contract'
                licenses {
                    license {
                        name = 'Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
            }
        }
    }
}

// FR5: the published surface's version IS the compatibility contract, so a
// module reaching publication must have replaced the shared placeholder version
// with a real semver (design D10 — the japicmp gate that consumes it is turned
// on in change B). MAJOR.MINOR.PATCH with the optional pre-release / build
// metadata of semver 2.0.0; `-SNAPSHOT` is rejected by the pre-release rule
// below only insofar as it is not a valid identifier set — it is allowed as a
// pre-release, but the placeholder `0.1.0-SNAPSHOT` is rejected explicitly.
def semver = ~/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z-.]+)?(?:\+[0-9A-Za-z-.]+)?$/
// Read through a Property filled in `afterEvaluate`, not `project.version` at
// apply time: the module sets its own version further down its build script, so
// an eager read here always sees the placeholder `java-conventions` assigned.
// A Property (rather than a closure over `project`) keeps the task
// configuration-cache safe.
def declaredVersionHolder = objects.property(String)
afterEvaluate {
    declaredVersionHolder.set(project.version.toString())
}
tasks.register('verifyPublishedApiVersion') {
    description = 'Fails unless the published API module declares a real semver version (FR5 of split-into-modules).'
    group = 'verification'
    def versionProperty = declaredVersionHolder
    doLast {
        def declaredVersion = versionProperty.get()
        if (!(declaredVersion ==~ semver)) {
            throw new GradleException(
                    "Published API version '${declaredVersion}' is not a valid semver: " +
                    'the version is the compatibility contract (FR5), so it must be set explicitly on this module.')
        }
        if (declaredVersion.endsWith('-SNAPSHOT')) {
            throw new GradleException(
                    "Published API version '${declaredVersion}' is still the shared placeholder: " +
                    'set a real semver version on this module (FR5, design D10).')
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('verifyPublishedApiVersion')
}

// Binary-compatibility GATE over the published contract (FR14, design D9 of
// add-plugin-architecture; FR5, design D10 of split-into-modules). Flipped from
// report-only now that the api has its first external consumer: an incompatible
// change breaks the build (M5) instead of landing in a report nobody reads.
//
// The compared surface is this module's jar plus the PROJECT artifacts it
// re-exposes — `api project(':domain')` (design D4) — so the `:domain` types the
// ports are typed in carry the same semver promise. Third-party libraries are
// deliberately excluded: they are not our contract, and their releases must not
// be able to fail our gate.
def apiSurface = configurations.named('runtimeClasspath').map { conf ->
    conf.incoming.artifactView { view ->
        view.componentFilter { it instanceof org.gradle.api.artifacts.component.ProjectComponentIdentifier }
    }.files
}

// The baseline is COMMITTED next to the module rather than resolved from a
// repository. Nothing is published yet, and a gate that silently skips whenever
// its baseline is unavailable is not a gate — it is a report with extra steps.
// The jars are regenerated by `updateApiCompatibilityBaseline`, the deliberate
// and reviewable act that accepts a surface change (an `apiDump`-style
// workflow): the diff shows both the new baseline and the version bump that
// justifies it.
def baselineDir = layout.projectDirectory.dir('compat-baseline')
def committedBaseline = fileTree(baselineDir) { include '*.jar' }

// `-PapiBaselineVersion=<semver>` overrides the committed jars with a released
// artifact, for the day this api is published to a repository.
def apiBaselineVersion = providers.gradleProperty('apiBaselineVersion')

configurations.register('apiCompatibilityBaseline') {
    canBeConsumed = false
    canBeResolved = true
    description = 'A released API artifact japicmp compares the current surface against, overriding the committed baseline.'
}

dependencies {
    if (apiBaselineVersion.isPresent()) {
        apiCompatibilityBaseline "${project.group}:${project.name}:${apiBaselineVersion.get()}"
    }
}

tasks.register('updateApiCompatibilityBaseline', Sync) {
    description = 'Regenerates the committed japicmp baseline from the current API surface — run only when a surface change is intended (FR14).'
    group = 'verification'
    from(tasks.named('jar'))
    from(apiSurface)
    into(baselineDir)
}

tasks.register('japicmpApiGate', me.champeau.gradle.japicmp.JapicmpTask) {
    description = 'Fails the build on a binary-incompatible change to the published API surface (FR14, M5 of add-plugin-architecture).'
    group = 'verification'
    oldClasspath.from(apiBaselineVersion.isPresent()
            ? configurations.named('apiCompatibilityBaseline')
            : committedBaseline)
    newClasspath.from(tasks.named('jar'), apiSurface)
    // Only the breaking subset fails: an addition is a compatible change and a
    // MINOR bump, not something an author must re-baseline to get past.
    onlyBinaryIncompatibleModified = true
    failOnModification = true
    failOnSourceIncompatibility = false
    // The baseline resolves without the consumer's own compile classpath, so
    // unresolvable references in unrelated types must not abort the comparison.
    ignoreMissingClasses = true
    txtOutputFile = layout.buildDirectory.file('reports/japicmp/api-compatibility.txt')
    htmlOutputFile = layout.buildDirectory.file('reports/japicmp/api-compatibility.html')
    def baselinePath = baselineDir
    doFirst {
        if (oldClasspath.isEmpty()) {
            throw new GradleException(
                    "No API compatibility baseline in ${baselinePath}: the gate cannot run (FR14). " +
                    'Restore the committed jars, or regenerate them with `updateApiCompatibilityBaseline` ' +
                    'if this is a deliberate, version-bumped surface change.')
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('japicmpApiGate')
}
