import com.github.oinsio.gnomish.build.MutationEngineLock

// Mutation-gate conventions shared by every module with production Java (FR6, FR11,
// design D6/D9 of split-into-modules): PIT wired into the module's own `check`,
// targeting that module's production packages and nothing else, so root `check`
// aggregates every module's run while `:module:check` mutates only that module.
// Module-specific exclusions stay in the module's build file; split out of
// `test-conventions` at task 8.1 — one file is one thing.
plugins {
    id 'java-conventions'
    id 'info.solidsoft.pitest' // mutation testing gate, FR6 (design D5)
    // What this build mutates — targetClasses, the shared skip, the scope line.
    id 'pitest-scope-conventions'
    // What happens to a run's result — status gate, `check` wiring, report path.
    id 'pitest-gate-conventions'
}

def libs = extensions.getByType(VersionCatalogsExtension).named('libs')

// One module mutates at a time (see `MutationEngineLock`): every module's `pitest`
// sizes its minion pool to the whole machine, so letting two of them overlap
// oversubscribes the CPUs badly enough to crash minions and red the gate.
def mutationEngine = gradle.sharedServices.registerIfAbsent('mutationEngine', MutationEngineLock) {
    maxParallelUsages = 1
}

pitest {
    // asProvider(): 'pitest' is a prefix of other catalog version aliases.
    pitestVersion = libs.findVersion('pitest-tool').get().requiredVersion
    junit5PluginVersion = libs.findVersion('pitest-junit5-plugin').get().requiredVersion
    // Concurrent PIT minion JVMs for the mutation phase (PIT's default is 1). The -2
    // keeps headroom for the daemon and concurrent tasks; without it, CPU
    // oversubscription pushes covering tests past PIT's per-mutation timeout and
    // pitestVerifyAllKilled fails on the TIMED_OUT. This is the CPU ceiling only —
    // the memory ceiling is applied in `afterEvaluate` below, once the heavy-JVM
    // budget's own slot count is readable.
    threads = Math.max(1, Runtime.runtime.availableProcessors() - 2)
    // `targetClasses` is NOT set here: what this build mutates — Java production
    // code only, never Groovy test bytecode (.claude/rules/testing.md) — is
    // `pitest-scope-conventions`'s (scope-pit-locally D1).
    // Set explicitly rather than leaning on PIT's default (which falls back to
    // targetClasses and finds the specs only by the coincidence that they share
    // the package tree; an empty test scan is what lets a run count every
    // mutation as RUN_ERROR and still report ~100%). Deliberately the whole
    // prefix: a module's specs may sit in a package its production code does not
    // own, and PIT only mutates this module's classes anyway (mutableCodePaths).
    targetTests = ['com.github.oinsio.gnomish.*']
    mutationThreshold = 100 // 100% mutation score gate (FR6)
    // Per-mutation timeout budget (allowed = recorded test time × factor + const).
    // The factor absorbs load: times are recorded in the single-threaded coverage
    // pass, but the mutation phase runs `threads` minions at once, 2–3× slower. The
    // constant absorbs the freshly forked minion's cold start (Groovy/Spock class
    // loading before the covering test runs), which the factor barely multiplies for
    // a millisecond-scale test — observed to overrun a 20 s budget alone on a 4-core
    // GitHub runner (UsageHistoryWalker.answered, NullReturnValsMutator, TIMED_OUT
    // there, KILLED locally by a sub-second spec). TIMED_OUT never counts as a kill
    // (pitestVerifyAllKilled fails on it), so a genuinely hanging mutant still reds
    // the build; the cost is 40 s more per true offender in a multi-minute run.
    timeoutFactor = 3.0
    timeoutConstInMillis = 60000
    // Deliberately NO -Xmx for the minions. Bounding it looks like the fix for the
    // "Minion did not start or died during analysis ... insufficient memory" deaths
    // this build hit, but it trades them for a worse failure: some mutants only die
    // because a covering spec fails first, and a hot-spinning one (removing
    // `Sleeper::sleep` from InstanceHeartbeat's loop) then exhausts a capped heap
    // before that spec finishes — MEMORY_ERROR with numberOfTestsRun=0, reproducible
    // at both 1g and 4g. Total memory pressure is governed by the heavy-JVM budget
    // (`test-conventions`) instead, which bounds how many minion pools and 3g test
    // JVMs coexist.
    timestampedReports = false // stable report path for CI artifact upload
    outputFormats = ['XML', 'HTML']
}

// The mutation phase's memory ceiling (FR1/D1 of adapt-build-load-to-hardware, whose
// stated invariant is "a memory budget, not a worker count"). Sizing the minion pool
// by cores alone contradicted it: on a 14-core/36 GB host PIT forked 12 unbounded
// minions while the heavy-JVM budget rated the same machine at 9 concurrent JVMs, and
// `:module:check` — where the daemon is hot from the module's own `test` and JaCoCo
// run — then hit "Minion did not start or died during analysis ... insufficient
// memory". PIT records that dead minion as RUN_ERROR with numberOfTestsRun=0 on
// whichever mutation it held, so the offender moved between unrelated classes from run
// to run and `pitestVerifyAllKilled` failed on a gate that had nothing to do with the
// code under test. Measured on that host: the pool peaked at ~9.3 GB with under 10 GB
// free, and `:module:pitest` alone (cold daemon) never reproduced it in 6 runs while
// `:module:check` reproduced it in 3 of 3.
//
// Clamping to the budget's slot count rather than bounding the minion heap: `-Xmx` is
// the fix that looks obvious and is already rejected above for a reproducible reason.
// Read from the registration's parameters, not from the service instance, so the
// budget is not instantiated at configuration time — that would move its decision line
// out of the execution phase where NFR-O1 wants it.
afterEvaluate {
    def budget = gradle.sharedServices.registrations.findByName('heavyJvmBudget')
    if (budget != null) {
        pitest.threads = Math.max(1, Math.min(pitest.threads.get(), budget.parameters.slots.get()))
    }
}

// Per-method exemptions are NOT configured here: they are carried by the
// project's own `@com.github.oinsio.gnomish.DoNotMutate` marker, which PIT
// honours build-wide with no Gradle wiring — see `.claude/rules/testing.md`.
tasks.named('pitest') {
    usesService(mutationEngine)
    // One slot of the machine's heavy-JVM budget (FR2/D4): a minion pool is a
    // deliberate under-approximation of one slot, accepted because
    // `MutationEngineLock` keeps it to one pool machine-wide and HEADROOM_GB covers
    // the minions (proposal Q2). Looked up rather than registered: the budget is
    // computed in `test-conventions`, which applies THIS plugin from its `plugins`
    // block — so this script body runs first, and only the deferred task
    // configuration below is late enough to see the registration.
    def heavyJvmBudget = gradle.sharedServices.registrations.named('heavyJvmBudget').get().service
    usesService(heavyJvmBudget)
    // Instantiate on first use so the budget decision is logged even in a build whose
    // only heavy task is this one (NFR-O1) — see the same doFirst in `test-conventions`.
    doFirst('announce the heavy-JVM budget') { heavyJvmBudget.get() }
    // PIT's coverage pass re-runs the covering suite in a separate minion JVM —
    // including Docker-backed specs that materialize real containers/volumes
    // named after a fixed per-test id. Undeclared ordering + org.gradle.parallel
    // lets Gradle run `pitest` and `test` concurrently, racing to create the
    // same-named Docker objects. `mustRunAfter` serializes them without adding a
    // real dependency (`pitest` does not consume `test`'s output).
    mustRunAfter tasks.named('test')
    // The scope skip — no mutable class in this module this build — is
    // `pitest-scope-conventions`'s, shared with the verdict tasks (NFR-R3).
}
