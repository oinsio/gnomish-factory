# --- Accepted risk: httpclient5/httpcore5(-h2) superseded conflict candidates,
# metadata-only ---
# `gradle/verification-metadata.xml` records the POM (not the JAR) of every
# version Gradle's conflict resolution considered while picking a winner —
# fetching a losing candidate's POM is how Gradle learns its dependencies well
# enough to reject it. The forced fix versions (httpclient5 5.6.3, httpcore5(-h2)
# 5.4.3 — see gradle/libs.versions.toml) win on every real classpath; these
# entries carry `.pom` artifacts only, no `.jar`, confirming they were never
# actually resolved as a dependency. This is inherent to how Gradle dependency
# verification records a resolution graph, not a fixable version pin.
