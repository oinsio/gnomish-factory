# --- Accepted risk: WireMock-transitive Handlebars advisory, no compatible fix ---
# GHSA-r4gv-qr8j-p3pg (com.github.jknack:handlebars, response templating) is
# fixed only in 4.5.2, which removes handlebars.helper.NumberHelper — a class
# WireMock 3.13.2 loads at startup, so bumping breaks every WireMock spec
# (NoClassDefFoundError) — and the line has since moved on to 4.5.4 (Maven
# Central, 2026-08-16) without changing that. Test-scope only (in-JVM localhost
# mock server, never shipped) and all templates are developer-authored, so the
# SSTI vector is not reachable. Resolved when WireMock 4.x (which ships a
# compatible handlebars) goes stable. Re-review 2026-11-01.
[[IgnoredVulns]]
id = "GHSA-r4gv-qr8j-p3pg"
ignoreUntil = 2026-11-01
reason = "Test-scope only (WireMock 3.13.2 templating, localhost, never shipped, developer-authored templates). Fix 4.5.2 removes NumberHelper and breaks WireMock 3.13.2 at startup; WireMock 4.x still beta. Re-review 2026-11-01."
