# OSV-Scanner configuration (FR11, NFR-S1 of add-project-skeleton;
# FR1, FR8, NFR-S1, NFR-S2 of fix-osv-dependency-gate).
#
# This is the ONE allowlist for the whole build. OSV-Scanner would otherwise
# resolve a config per scanned package source — next to each lockfile — so this
# root file governs the module lock state (`adapters/github/gradle.lockfile`,
# `bootstrap/gradle.lockfile`, `bootstrap/buildscript-gradle.lockfile`) only
# because the scan job passes `--config=osv-scanner.toml` explicitly (design D1,
# see .github/workflows/osv-scan.yml). Do NOT add a per-module
# `osv-scanner.toml`: an explicit `--config` shadows it. A module added later is
# covered by this file with no extra wiring.
#
# It holds only reviewed false positives, each stating its classpath scope, why
# no adoptable fix exists, and an expiry date — the gate stays failing for every
# other advisory, and an expired entry fails again to force a re-decision
# (NFR-S2). An advisory on a PRODUCTION runtime classpath is never listed here;
# it is fixed by pinning a version (NFR-S1) — see the security-override block in
# gradle/libs.versions.toml. Keep this list short.

