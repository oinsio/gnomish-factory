# --- Accepted risk: WireMock-transitive Jetty 11 advisories with no Maven
# Central fix ---
# WireMock 3.13.1 (the latest stable line) runs on an embedded Jetty 11 stack,
# pinned consistently at 11.0.26 (the last Maven Central release of the EOL
# Jetty 11 line) via an enforcedPlatform in build.gradle. The advisories below
# are fixed only in Jetty 12.x; the 11.0.31 "fix" some list is not published to
# Maven Central (EOL vendor patches only). Moving to Jetty 12 requires WireMock
# 4.x, which is still beta (4.0.0-beta.10 as of 2026-07) — the project pins
# stable deps only (see gradle/libs.versions.toml). These jars are TEST-SCOPE
# ONLY (testCompileClasspath/testRuntimeClasspath): an in-JVM mock HTTP server
# bound to localhost during the build, never shipped in any factory artifact and
# never exposed to untrusted input, so the CVEs are not reachable at runtime.
# Re-review 2026-10-01: drop these once WireMock 4.x (Jetty 12) is stable.
# jetty-http (GHSA-355h fix 12.0.33, GHSA-qh8g fix 12.0.12, GHSA-wjpw fix 12.0.31):
