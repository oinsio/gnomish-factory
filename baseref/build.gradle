// Build script for the `:baseref` module (FR10, NFR-S3, design D2 of
// add-base-ref-resolution): the pure base-resolution policy — the allowed-base
// pattern grammar and its roles, the per-task designator's validation against it,
// the fixed source-priority order, and the `(ref, rule, reason)` decision it hands
// back. Values in, a decision out.
//
// The module reaches exactly ONE other project — the JDK-only `:untrustedtext` leaf —
// and nothing else: no Spring, no Jackson, no logging API. Unlike `:atomicfile`, whose
// emptiness exists to keep its consumers free of transitive coupling, this leaf's
// near-emptiness is a *security* property: an allowlist this short is what
// constructively guarantees the policy can know nothing of subprocesses, git remotes,
// tracker labels or configuration formats, so no repository-provided input can reach
// anything but pattern matching over plain values (NFR-S3).
//
// `:untrustedtext` does not weaken that. The policy still knows nothing of *where* a
// designator value came from; what it gained (task 6.1 of type-untrusted-text) is the
// type that says the value is not the factory's own words, so a refusal the policy
// builds carries the values in a form a report can only render through an exit. The
// leaf is itself dependency-free, so admitting it adds no transitive reach at all —
// the same edge `:domain` and the published contract already carry. There is no production-scope
// declaration below because there is nothing to declare, and the layering gate
// proves it stays that way.
//
// What stays outside: `ls-remote --symref` and the refresh fetch live in
// `:adapters:git`, the `base:` DTO parsing lives in the pipeline loader, and the
// orchestration and pinning live in `:application`. The tracker port's designator
// shape is mapped onto this module's own input value by `:application`, because
// this module may import nothing.
//
// The Spock/Groovy test stack, the JSpecify + Error Prone compiler plugins and
// the PIT mutation gate all come from the convention plugins.
plugins {
    id 'library-conventions'
    // The FR2 direction gate of split-into-modules; the permitted reach — one
    // JDK-only leaf — is stated below.
    id 'layering-conventions'
}

description = 'Base-ref resolution policy: allowed-base patterns, designator validation, source priority.'

dependencies {
    // The untrusted-text leaf (FR1, design D3/D4 of type-untrusted-text, extended at task 6.1):
    // a task's base designator is tracker text, and the refusal this policy builds from it is
    // published to the tracker. `api`, not `implementation`: `BaseDesignator`,
    // `DesignatorSelection.Refused` and `BaseResolution.Underdetermined` all name the carrier on
    // this module's public surface, so every consumer compiles against it — and it is a JDK-only
    // leaf, so the policy stays framework-free.
    api project(':untrustedtext')
}

// `:baseref` reaches exactly one other project, the JDK-only `:untrustedtext` leaf —
// the same shape `:domain` carries, here for the reason stated above: an allowlist
// holding nothing but a dependency-free leaf is the constructive half of NFR-S3.
layering {
    allowedProjects = [':untrustedtext']
}
