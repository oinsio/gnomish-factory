# Build performance and reproducibility (NFR-P1, NFR-R1 of add-project-skeleton).
# Configuration cache is Gradle 9's preferred mode (design D7).
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# --- Buildscript-classpath dependency version overrides ---
# These versions live here, not in gradle/libs.versions.toml, because the
# version catalog is not visible to the `buildscript {}` block (the same Gradle
# limitation that keeps the foojay plugin version literal in settings.gradle).
# build.gradle's buildscript block references them by name, so bumping a
# buildscript override never requires editing build.gradle itself.
# Security overrides forcing CVE fixes onto Gradle-plugin transitives:
#  - commons-lang3: GHSA-j288-q9x7-2f5v (a plugin drags in 3.16.0)
#  - tools.jackson: GHSA-5gvw-p9qm-jgwh in jackson-databind (a plugin drags in 3.1.4)
# Drop each once the offending plugin ships the fixed transitive.
buildscriptCommonsLang3Version=3.18.0
buildscriptJacksonVersion=3.1.5
