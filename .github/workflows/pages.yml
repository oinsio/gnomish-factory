# Publishes the static landing page in `site/` to GitHub Pages.
# Source of the page is `main`; no `gh-pages` branch is involved. The repository's
# Pages source must be set to "GitHub Actions" (Settings → Pages).
#
# Action versions are pinned by major tag; Dependabot keeps them fresh.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Least privilege: read the repo, publish the Pages artifact, nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel one already in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
