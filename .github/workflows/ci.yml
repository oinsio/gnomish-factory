# CI quality gate: runs `./gradlew check` (Spock + JaCoCo + PIT + Spotless +
# static analysis) on every push and pull request.
# Implements FR7, NFR-O1, NFR-C1, NFR-S2 of add-project-skeleton (design D6/D7).
# Implements FR5, FR7 of scope-pit-locally (design D1, D8).
#
# Action versions are pinned by major tag; Dependabot (`.github/dependabot.yml`)
# keeps them fresh. Design D7 mandates least-privilege permissions, concurrency
# cancellation, and wrapper validation — not SHA pinning.
name: CI

# Trigger pattern: run on every branch push (FR7); the pull_request event is used only
# for PRs from forks (which get no push events in this repo). Same-repo PR
# branches are already covered by their push runs, so the job-level `if` below
# skips the duplicate pull_request run (NFR-C1: no double builds per commit).
# A tag push starts no run (`branches: ['**']` matches every branch and no tag):
# the release workflow judges the run this commit already has on `main`, and a
# second `check` for the same commit would cost 20 minutes and shadow that
# verdict in its run query (FR2, NFR-C1 of add-release-pipeline, design D6).
on:
  push:
    branches: ['**']
  pull_request:

# Least-privilege token: the build only reads the repo contents (NFR-S2).
permissions:
  contents: read

# Cancel superseded in-flight runs for the same ref (NFR-C1).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Skip pull_request runs for same-repo branches — the push run covers them.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history (not the default shallow clone): the build computes its
          # own mutation scope from the merge base with main or origin/main
          # (MutationScopeSource, scope-pit-locally D1/D3), and a shallow clone
          # has no merge base, so the scope would widen to the whole tree. A
          # fork pull_request run needs no separate base: its checkout is the
          # refs/pull/N/merge commit, whose merge base with origin/main is the
          # base branch tip, so the diff is exactly the pull request's changes.
          fetch-depth: 0

      # The factory refuses a git below its floor, 2.56.0 (GitVersion.FLOOR; FR10, UX3 of
      # own-git-invocation-policy, design D11), ubuntu-latest ships an older one (2.55.0 on run
      # 39484184528), and no Ubuntu package source publishes 2.56.0. scripts/install-git.sh builds
      # the pinned kernel.org release, as the Linux spec runner's image does
      # (scripts/linux-runner/Dockerfile). The checkout above runs on the runner's own git; nothing
      # of the factory runs git before the floor check below. The installed tree is cached, keyed
      # on the runner's Ubuntu release (the libraries it links against), its architecture and the
      # script's hash (the version, the checksum and the build flags).
      - name: Name the runner's Ubuntu release
        id: os
        run: echo "release=$(. /etc/os-release && echo "$ID-$VERSION_ID")" >> "$GITHUB_OUTPUT"

      - name: Restore the built git
        id: git-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.tool_cache }}/gnomish-git
          key: gnomish-git-${{ steps.os.outputs.release }}-${{ runner.arch }}-${{ hashFiles('scripts/install-git.sh') }}

      # On a cache hit the script finds the pinned version already installed, builds nothing and
      # still runs its floor check.
      - name: Install git from source
        run: scripts/install-git.sh --prefix "${{ runner.tool_cache }}/gnomish-git"

      # Saved right after the build, not in a post step, so a later red step does not cost the
      # next run another build.
      - name: Save the built git
        if: steps.git-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.tool_cache }}/gnomish-git
          key: ${{ steps.git-cache.outputs.cache-primary-key }}

      - name: Put the built git first on PATH
        run: echo "${{ runner.tool_cache }}/gnomish-git/bin" >> "$GITHUB_PATH"

      # The log names the git the specs ran on; a wrong PATH or build fails here, not in a spec.
      - name: Git meets the factory's floor
        run: |
          test "$(command -v git)" = "${{ runner.tool_cache }}/gnomish-git/bin/git"
          git --version
          git version | awk '{ split($3, v, "."); exit !(v[1] > 2 || (v[1] == 2 && v[2] >= 56)) }'

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Validate gradle-wrapper.jar against known checksums (NFR-S2).
          # On by default in v6; kept explicit as a documented security gate.
          validate-wrappers: true

      # No mutation scope is passed: the build resolves the branch's scope
      # itself, exactly as a local `./gradlew check` does, and prints it once
      # as the `PIT scope:` line (scope-pit-locally FR5, design D1/D6). A
      # module the scope leaves untouched skips its gate cleanly. --profile
      # writes build/reports/profile/ for the upload below (FR7, design D8).
      - name: Run quality gates
        run: ./gradlew check --profile

      # Reports are uploaded even when the build fails — a red gate is exactly
      # when the HTML/XML reports are needed (NFR-O1). 14-day retention keeps
      # storage cost bounded (NFR-C1). Each module writes its own reports since
      # the split (split-into-modules FR11, task 8.3), so the paths glob over
      # every module and the artifact keeps the module directory in each entry.
      - name: Upload JaCoCo reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: '**/build/reports/jacoco/test/'
          retention-days: 14

      - name: Upload PIT reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: pit-report
          path: '**/build/reports/pitest/'
          retention-days: 14

      # Where the build's time went, task by task (scope-pit-locally FR7, D8).
      # A Gradle that writes no profile leaves nothing to upload, which must
      # not turn a green run red.
      - name: Upload Gradle profile
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: profile
          path: build/reports/profile/
          if-no-files-found: ignore
          retention-days: 14
