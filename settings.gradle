// Settings for the gnomish-factory build.
// Implements FR1, NFR-R1 of add-project-skeleton.
pluginManagement {
    // Shared build logic lives in the `build-logic` included build, so its
    // convention plugins are applied by id without publishing anything
    // (FR6, design D9 of split-into-modules).
    includeBuild 'build-logic'
}

plugins {
    // Auto-provisions the pinned JDK toolchain on machines that lack it (design D7).
    // Version is declared here literally because the version catalog is not
    // available to the settings plugins block; all other versions live in
    // gradle/libs.versions.toml (design D2).
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
    // Dependency-analysis gate (FR10 of add-project-skeleton, design D8). From
    // the multi-module split on it is applied here rather than in the root
    // build script: the project-scoped plugin only analyses the project it is
    // applied to, so a root-only application reported "no project health
    // reports found" and silently skipped every module (FR2, FR6). This
    // settings-scoped `build-health` variant applies the analysis to every
    // project in the build; the `dependencyAnalysis {}` configuration and the
    // `check`-wiring stay in the root build script.
    // Version literal for the same reason as foojay above: the version catalog
    // is not available to the settings plugins block. Kept in step with
    // `[versions].dependency-analysis` in gradle/libs.versions.toml.
    id 'com.autonomousapps.build-health' version '3.19.2'
}

rootProject.name = 'gnomish-factory'

// The layered module tree (FR1, design D1 of split-into-modules). Modules are
// added pass by pass; whatever has not been extracted yet still lives in the
// root project, which stays the composition root until `:bootstrap` exists.
include 'domain'
// The subprocess-supervision leaf (FR9, NFR-S3, design D9 of
// bound-subprocess-commands): the factory's one wait/kill/drain discipline for
// the OS processes it launches — git, docker, agent CLIs, verify commands.
// Deliberately dependency-free (JDK only), which is what lets `:gitobjects`
// depend on it without acquiring a dependency on the factory or its domain.
include 'subprocess'
// The atomic-file-write leaf (FR5, design D10 of harden-task-branch-contract):
// the factory's one temp-file-plus-rename discipline, consumed by the host-side
// `.gnomish-task/` writers in `:adapters:git` and by the dashboard and snapshot
// writers in `:application`. Dependency-free for the same reason `:subprocess`
// is: a shared writer that dragged a dependency behind it would push that
// dependency into every layer that writes a file.
include 'atomicfile'
// The logging-support leaf (FR4, FR6, FR8, design D5/D10 of
// harden-logging-observability): the untrusted-text sanitizer every log line
// routes through, the repeat suppressor poll loops log their edges with, and
// the MDC-propagation helper virtual-thread hops wrap their bodies in.
// Dependency-free but for `slf4j-api` — every layer's emitters share it, so
// anything it dragged behind it would land in `application`, the adapters and
// the sandbox backends alike, which is exactly the coupling `:atomicfile` and
// `:subprocess` are kept empty to avoid.
// The untrusted-text leaf (FR1, NFR-S1, design D2 of split-logtext-leaves): the one
// character-class table naming what is hostile to a terminal and to a log reader, and the
// primitives both exits are built from — stripping, the tail and record caps, newline
// flattening and the console notation. Carved out of `:logtext` because text safety is not
// logging plumbing: the domain and the published plugin contract need the primitives and
// must not acquire the slf4j edge `:logtext` carries. Dependency-free for `:baseref`'s
// security reason rather than `:atomicfile`'s coupling one — an empty allowlist is what
// constructively guarantees terminal-safety policy can know nothing of subprocesses,
// trackers or configuration formats (NFR-S1).
include 'untrustedtext'
// The operator-event leaf (FR4, design D1 of split-logtext-leaves): the catalog of
// `[GFnnn]` codes, one constant per production WARN/ERROR call site, that gives every
// operator line a stable identity an alert or a grep can key on. Carved out of `:logtext`
// beside `:untrustedtext` and kept separate from it because the two share nothing but
// "JDK-only and reachable from the domain": the domain's four emitters need the constant so
// they stop repeating their codes as literal message heads, and they must not acquire the
// slf4j edge `:logtext` carries. Dependency-free for the same reason `:untrustedtext` is —
// the domain and the published plugin contract both reach it, so any edge added here would
// land in both.
include 'operatorevent'
include 'logtext'
include 'gitobjects'
// The git-transfer leaf (FR1, FR2, design D1 of own-git-transfer-argv): the one owner of
// the argv and the environment of every factory git transfer — the closed set of transfer
// source kinds (origin, a task container over `ext::`, a local seed path), the common
// deny-by-default side-effect set, the per-source protocol allowlist and configuration
// isolation, and the git version floor. Values in (a source and a refspec), values out (an
// argument list and an environment map): nothing in the leaf launches a process or touches
// the filesystem. A leaf because its two consumers sit on opposite sides of the layering —
// `:adapters:git` runs the argv through the git runner, `:sandbox:docker` renders the seed
// clone into its helper script — and share no other edge, so only a module both can reach
// serves both from one owner. Dependency-free for `:baseref`'s security reason: an empty
// allowlist is what constructively guarantees the transfer policy can know nothing of
// trackers, containers, or configuration formats, and any edge added here would be pushed
// into both consumers (NFR-S1, NFR-S2).
include 'gittransfer'
// The base-resolution leaf (FR10, design D2 of add-base-ref-resolution): the pure
// policy that decides which ref a new task branch starts from — the allowed-base
// pattern grammar, the per-task designator's validation against it, the source
// priority order, and the decision value it hands back. Values in, a decision out:
// no subprocess, no port, no factory type. Its one edge is the JDK-only
// `:untrustedtext` leaf, which its refusal value names so a tracker's designator
// values travel typed (task 6.1 of type-untrusted-text); with that leaf being itself
// dependency-free, the allowlist still constructively guarantees the policy can know
// nothing of trackers, git remotes, or configuration formats (NFR-S3).
include 'baseref'
include 'gnomish-plugin-api'
// Not a layer of the factory: a stand-in third-party adapter that keeps the
// api's "one declared dependency" promise honest by compiling against it and
// nothing else (UX3, FR4).
include 'gnomish-plugin-api:sample'
// The sandbox port layer (FR8, design D7/D11). Extracted before the `app` split
// so `:application` has the port edge to depend on when it is carved.
include 'sandbox:core'
// The execution-environment backend module (FR8, design D7): the docker-CLI
// container backend plus the host backend and the subprocess mechanics the two
// share as package-private collaborators (task 6.1's deviation note). Backends
// implement the `:sandbox:core` port; future backends (colima / gha / cloud)
// arrive as sibling modules created by their own changes (Q4).
include 'sandbox:docker'
// The application layer (FR3, design D1/D3): the use cases and the ports they
// drive adapters through, carved out of the old `app` package. The composition
// half of that package — `main()`, `@Configuration`, and the assembly classes —
// stays in the root project, which becomes `:bootstrap` once the adapters leave
// (task 4.7, D2's sequencing correction).
include 'application'
// Every port realization that talks to something outside the factory (FR1,
// FR2, design D1). Pass 1 moved them as one block (D2); pass 2 (task 10) cuts
// the vendor and technology seams out of it. `:adapters` itself stays: it is
// the coarse remainder D1 deliberately does not split — the packages whose
// module overhead would exceed the benefit — and the parent of the modules that
// left it.
include 'adapters'
// The GitHub vendor bundle (task 10.1, FR10): the shared HTTP core plus the
// tracker and external-check realizations written against it, in one module
// because D1 keeps the core an internal package of the bundle rather than a
// third build unit.
include 'adapters:github'
// The two technology seams (task 10.2, FR10): the git-subprocess adapter, D1's
// largest, and the agent-CLI executor. `:adapters:git` is a leaf; `:adapters:agent`
// is the one module that depends on the coarse remainder, for the frozen
// pipeline law and the briefing renderer it shares with the console.
include 'adapters:git'
include 'adapters:agent'
// The composition root (FR3, design D1/D3): `main()`, the Spring
// configuration, the assemblies that bind ports to adapters, the Boot packaging
// and the E2E layers. Extracted last, from whatever remained in the root
// project once `:application` and `:adapters` had left (task 4.7, D2's
// sequencing correction), so the root project now holds no source at all.
include 'bootstrap'
// Extracted alongside `:domain` rather than in its own pass (task 7.1): the
// shared fakes and port-contract suites live in the domain test tree, so the
// root project's specs lose them the moment `:domain` is carved out (FR7, D8).
include 'test-fixtures'
