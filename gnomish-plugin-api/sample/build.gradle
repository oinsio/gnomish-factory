// UX3, FR4 of split-into-modules; FR4/G1 of close-plugin-api-compilability-gap:
// the executable proof that the published contract is self-sufficient. This
// module is a stand-in for a third-party bundle realizing the tracker SPI — the
// only SPI since task 6.1 of migrate-verify-to-executor-contract removed the
// check SPI. Beside it, `verdict/sample-verdict.sh` is the sample verdict program
// (FR8 of that change): a POSIX script with no factory dependency at all, not
// compiled here, which `SampleVerdictProgramSpec` in `:bootstrap` runs through the
// conformance kit. The `dependencies` block below is the whole point —
// ONE declared dependency. Everything the sources touch must therefore reach them
// through `:gnomish-plugin-api` (directly or through the `:domain` types it
// re-exposes, design D4). The day that stops being true, this module stops
// compiling and `check` goes red.
//
// `java-library` + `java-conventions` rather than `library-conventions`: it has
// no tests of its own — compilation IS the assertion — so `test-conventions`
// would only add an unused test stack and a PIT task with no covering specs.
plugins {
    id 'java-library'
    id 'java-conventions'
    // Production-classpath direction gate (FR2, FR7, design D5): the one module
    // with sources that did not state its layering, so FR7's "no production
    // module depends on `:test-fixtures`" was asserted everywhere but here.
    id 'layering-conventions'
}

description = 'Compile-only proof that a third-party adapter needs gnomish-plugin-api and nothing else (UX3).'

dependencies {
    api project(':gnomish-plugin-api')
}

// The transitive closure of the single declared dependency, and nothing more:
// `:domain` arrives because the api re-exposes its types (design D4). Stating
// it as data is what makes a future api edge — to an adapter, to
// `:test-fixtures` — fail `check` here rather than quietly widening what a
// third-party adapter drags in (UX3, FR7).
layering {
    allowedProjects = [
        ':domain',
        ':gnomish-plugin-api',
        // The operator-event catalog leaf (FR11, design D9 of split-logtext-leaves): transitive
        // via `:gnomish-plugin-api` and `:domain`. No source in this module names it — a third
        // party still compiles against one declared dependency; the layering gate walks the
        // transitive graph, so the reach is listed where it arrives.
        ':operatorevent',
        // The pending-key leaf (design D20 of migrate-verify-to-executor-contract): transitive via
        // `:gnomish-plugin-api` and `:domain`. No source in this module names it.
        ':pendingkey',
        // The untrusted-text leaf (FR11, design D9 of split-logtext-leaves): transitive via
        // `:gnomish-plugin-api`, whose findings sanitizer is a facade over it. Since FR4 of
        // type-untrusted-text this module's own sources name it too — the sample tracker mints
        // its snapshot's title and body as `TRACKER` carriers — and that is the point: a third party still compiles against one
        // declared dependency, because the leaf arrives through the api's own `api` edge.
        ':untrustedtext',
    ]
}
