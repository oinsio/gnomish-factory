// Build script for the `:gnomish-plugin-api` module (FR4, FR5, design D4/D10 of
// split-into-modules): the third-party contract surface a plugin is written
// against — the `Tracker` port and its DTO family, `SecretsProvider`, the
// `TrackerAdapterFactory` SPI with `TrackerSubsectionValidator`, and (task 2.2 of
// add-plugin-architecture) the `CheckClientFactory` SPI with
// `CheckParamsValidator`, `CheckSubsectionValidator` and the
// `ExternalCheckPinContributor` hook it exposes, plus (FR1/FR2 of
// close-plugin-api-compilability-gap) the two pieces a check plugin needs at
// compile time: the `AttemptCommitWorkspace` workspace-capability interface and
// the `FindingsSanitizer` contract utility.
//
// Nothing else belongs here. `application` and `bootstrap` internals are out by
// definition (M3); implementations live in the adapter modules.
plugins {
    // `published-api-conventions` = library conventions + `maven-publish`
    // (sources and javadoc jars for UX3), the real-semver assertion, and the
    // report-only japicmp surface report (FR5, design D10).
    id 'published-api-conventions'
    // The FR2 direction gate; `layering { allowedProjects }` below states this
    // module's whole permitted reach (task 5.2).
    id 'layering-conventions'
}

// FR5, design D10: the api is versioned independently of the rest of the build,
// which still carries the shared `0.1.0-SNAPSHOT` placeholder from
// `java-conventions`. First real release of the contract surface; change B is
// where it is first consumed from outside and where the japicmp gate starts
// failing on an incompatible move.
//
// FR5 of close-plugin-api-compilability-gap: `compat-baseline/` was deliberately
// regenerated (`updateApiCompatibilityBaseline`) for the grown surface — the
// `AttemptCommitWorkspace` interface and the `FindingsSanitizer` utility. The
// growth is additive for every pre-existing type, so no pre-1.0 version bump is
// owed and `japicmpApiGate` stays green against the committed jars.
//
// FR19 of harden-task-branch-contract: 0.3.0 -> 0.4.0, the third BREAKING move. The tracker
// medium joined the branch medium in classifying totally, which the port surface had to carry:
// `Tracker` gained `repairIndex` and its `removeStaleClaim` now takes the observed `ClaimFacts`
// footprint rather than a live `ClaimVersion` (a dead footprint is an eligible input, and a
// version cannot express one); `OpenTask` and `ReadyTask` gained the raw `TrackerFacts` /
// `ClaimFacts` the core classifier reads, so both lose their old canonical constructors — each
// keeps a delegating constructor of the previous shape, so a reader that carries no observation
// of its own still compiles. Pre-1.0, a breaking change is a MINOR bump; `compat-baseline/` was
// regenerated in the same commit so a reviewer sees the break and the bump that accepts it in
// one diff.
//
// FR13 of harden-task-branch-contract: 0.2.0 -> 0.3.0, the second BREAKING move.
// `ClaimResult.Acquired` gained the claim epoch the tracker issues with a claim and
// `ClaimVersion` gained the same epoch beside its marker identity, so both lose their
// old canonical constructors. Pre-1.0, a breaking change is a MINOR bump;
// `compat-baseline/` was regenerated in the same commit so a reviewer sees the break
// and the bump that accepts it in one diff.
//
// FR2 of fix-denial-report-attachment: 0.1.0 -> 0.2.0, the first BREAKING move of
// the surface. `AttemptRecord` and both `ExecutionResult` variants — re-exposed
// `:domain` types, so inside the semver promise — gained a `denials` component,
// which removes their old canonical constructors. Pre-1.0, a breaking change is
// a MINOR bump; `compat-baseline/` was regenerated in the same commit so a
// reviewer sees the break and the bump that accepts it in one diff.
version = '0.4.0'

description = 'Third-party contract surface: tracker/secrets ports, the tracker and check SPI factories with their validators, the attempt-commit workspace capability and the findings sanitizer.'

dependencies {
    // `api`, not `implementation` (design D4, UX3): the ports' own signatures
    // are typed in `:domain` value types — TrackerConfig, ConfigError, Clock,
    // and (through the check/workspace ports the adapters also implement)
    // Finding, PollStatus, VerifyCheck. Exposing `:domain` transitively is what
    // lets a third party compile against ONE declared dependency.
    //
    // The check-side ports (`ExternalCheckClient`, `Workspace`) deliberately
    // stay in `:domain` rather than moving here as design D4 sketched: the
    // engine consumes them from inside `:domain`, so relocating them would make
    // `:domain` depend on this module and close the layering cycle FR2 forbids.
    // They reach a third party through this same transitive edge, so the
    // "single declared dependency" contract is unaffected.
    api project(':domain')

    // Shared fakes and port-contract suites (FR7, design D8), test scope only.
    testImplementation project(':test-fixtures')
}

// M3 / FR4: the published contract must carry nothing from `application` or
// `bootstrap`. The dependency-analysis gate (settings.gradle) already fails this
// module if it *uses* a type it has not declared, so the declared project set IS
// the used project set; `verifyModuleLayering` pins that set to what the FR2
// layering allows, transitively. Anything from an upper layer would have to
// appear here first, and does not.
//
// Task 5.2 replaced this module's own `verifyApiContractSurface` with the shared
// gate: same assertion, same failure mode, now stated the same way by every
// module instead of once here.
layering {
    allowedProjects = [':domain']
}
