// Build script for the `:gitobjects` module (FR1, design D1 of split-into-modules):
// the internal shared git-object library — a bare-repo commit/tree writer driven
// through `git` plumbing subprocesses.
//
// The module deliberately depends on nothing but the JDK and two JDK-only leafs,
// `:subprocess` and `:gittransfer` (design D19 of add-sandbox-core, pinned by
// GitObjectsBoundarySpec; design D1 of own-git-invocation-policy): no factory
// types, no logging backend, no Jackson. That property is what makes it
// extractable at all, and FR2 enforces it at the Gradle level too.
// The Spock/Groovy test stack and the JSpecify + Error Prone compiler plugins
// come from the convention plugins (design D9).
plugins {
    id 'library-conventions'
    // The FR2 direction gate (task 5.2); the permitted reach is stated below.
    id 'layering-conventions'
}

description = 'Internal shared git-object library: bare-repo commit/tree writes over git plumbing.'

dependencies {
    // The module's one production dependency (task 6.1, design D13 of
    // bound-subprocess-commands): the shared subprocess wait/kill/drain
    // discipline `GitExec.await` now runs on, replacing its own copy.
    // `:subprocess` is itself a dependency-free JDK-only leaf (design D9), so
    // the extraction property below is preserved — the folder move now carries
    // two modules instead of one. Since design D17 and D20 of
    // fix-terminal-receipt-convergence `GitExec` also launches through its
    // `ProcessLaunch` and reads both streams on its `Drain`. `implementation`: the
    // supervisor, the launch and the drains are held inside `GitExec`, which is
    // package-private, so nothing on this module's api surface mentions them.
    implementation project(':subprocess')
    // The factory's one git invocation policy (FR1, FR3, design D1, D2 of
    // own-git-invocation-policy): `GitExec` builds its whole command line through
    // `GitInvocation.commandLine` and removes the policy's environment set, so this
    // library holds no policy key of its own. `:gittransfer` is a JDK-only leaf with
    // no dependency at all; `implementation`, since `GitExec` is package-private.
    implementation project(':gittransfer')

    // Shared fakes and port-contract suites (FR7, design D8). No production
    // module may depend on `:test-fixtures` — test scope only.
    testImplementation project(':test-fixtures')
}

// `:gitobjects` is an extraction-ready library: the JDK, SLF4J, and the two
// dependency-free leafs `:subprocess` and `:gittransfer` only — never a factory
// module (FR2, design D19 of add-sandbox-core, as amended by design D13 of
// bound-subprocess-commands and design D1 of own-git-invocation-policy). The two
// entries are safe precisely because each leaf itself allows nothing: were a
// dependency ever added to either, this module's own gate would fail.
layering {
    allowedProjects = [
        // The git invocation policy's owner, declared directly above: `GitExec`
        // takes its command line and environment stripping from `GitInvocation`.
        ':gittransfer',
        ':subprocess',
    ]
}
