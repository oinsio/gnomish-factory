// Build script for the `:adapters:github` module (FR10, design D1/D2 of
// split-into-modules, pass 2): the GitHub vendor bundle, carrying the tracker
// realization `adapter.tracker.github` (the `Tracker` port). The GitHub Actions
// check left it for the core-side `:adapters:scm` as the `github-actions` built-in
// (FR13, design D4 of migrate-verify-to-executor-contract, task 3.3), and the
// shared HTTP core it was written against, D1's internal `adapter.github`
// package, left for the first-party library `:githubapi` (FR14, design D15),
// because the core-side GitHub built-ins need the same client and a second one
// would be a hand-synced pair.
//
// This is D1's first module warrant of both kinds at once: a vendor boundary
// (the DEC-9/DEC-10 plugin exemplar — the first adapter a third party would
// replace) and a PIT-scoping win (~70 production classes with the build's
// heaviest WireMock suite behind them).
plugins {
    id 'library-conventions'
    // The FR2 direction gate (task 5.2); the permitted reach is stated below.
    id 'layering-conventions'
}

description = 'GitHub vendor adapter bundle: the tracker port realization over the first-party GitHub HTTP core.'

dependencies {
    // Version management only; see the note in `domain/build.gradle`. The
    // Jackson override carries the CVE fix (GHSA-5jmj-h7xm-6q6v). `api`, as in
    // `:adapters`: the artifacts below travel on this module's `api` surface,
    // so their constraints have to travel with them.
    api platform(libs.spring.boot.dependencies)
    api platform(libs.jackson.bom)

    // The ports these adapters realize and the value model their signatures are
    // drawn in: the tracker port family and `SecretsProvider` from the published
    // contract, and `TrackerConfig` with its value model from the
    // domain. Each is used directly here, which the
    // dependency-analysis gate requires stated rather than inherited.
    //
    // These project edges plus `:logtext` below are the whole compile classpath of
    // this bundle:
    // `:application` is gone (FR3, M1 of close-plugin-api-compilability-gap), so the
    // first-party vendor adapter now compiles against exactly what a third-party
    // bundle would — the published contract plus the domain value model it exposes
    // transitively. Re-adding an `:application` edge here, on any configuration
    // including test, re-opens the G4 gap this change closed.
    api project(':gnomish-plugin-api')
    api project(':domain')

    // The logging-support leaf (FR4 of harden-logging-observability): the tracker sanitizes the
    // untrusted text it logs through it. `implementation` since task 3.3 of
    // migrate-verify-to-executor-contract moved the Actions check, whose public client record carried
    // the poll's `RepeatSuppressor`, to `:adapters:scm`: no signature here names it any more.
    implementation project(':logtext')
    // The operator-event catalog leaf (FR4, design D3 of split-logtext-leaves): every
    // WARN/ERROR site in this module takes its `[GFnnn]` head from an `OperatorEvent`
    // constant. `implementation`, not `api`: the enum is named only inside log calls,
    // never in a signature this module exports.
    implementation project(':operatorevent')
    // The untrusted-text leaf (FR3, design D2 of type-untrusted-text): this module mints the
    // tracker family, and `ParsedMarker` carries an `UntrustedText` component. `api`, not
    // `implementation`: the carrier sits on a public accessor, so it travels on this module's
    // own surface — which is what the dependency-analysis gate establishes.
    api project(':untrustedtext')
    // The first-party GitHub HTTP core (FR14, design D15 of
    // migrate-verify-to-executor-contract): client, credential rules, conditional-request
    // cache, rate-limit classification and retry, which this bundle's two realizations are
    // written against. `api`: the client and the cache sit on public constructors here.
    api project(':githubapi')
    // The HTTP egress leaf (design D16 of migrate-verify-to-executor-contract), test scope only since
    // task 3.3 moved the check provider, which admitted its operator connection itself, to
    // `:adapters:scm`: the refusal-classification specs admit their endpoints through it.
    testImplementation project(':httpegress')

    implementation libs.slf4j.api

    // The tracker and check JSON payloads. All three are `implementation`: the
    // DTOs are package-private to this bundle, so no Jackson type reaches a
    // consumer through this module's api surface — which the dependency-analysis
    // gate is what establishes, and which is one more thing the vendor cut buys
    // (in `:adapters` two of the three were `api`).
    implementation libs.jackson.annotations
    implementation libs.jackson.databind
    implementation libs.jackson.core

    // Shared fakes and the tracker / external-check port-contract suites (FR7,
    // design D8), test scope only.
    testImplementation project(':test-fixtures')
    // The core's fast-retry seam and mid-request interrupt helper, shared with
    // `:githubapi`'s own specs (task 3.0a of migrate-verify-to-executor-contract).
    testImplementation testFixtures(project(':githubapi'))
    // WireMock for the tracker/check HTTP contract specs, in-JVM — no Docker
    // (.claude/rules/testing.md). The pinned Jetty 11 line and its accepted-risk
    // advisories are documented in the root build script and osv-scanner.toml.
    testImplementation libs.wiremock
    testImplementation enforcedPlatform(libs.jetty.bom)
    // Logback's ListAppender backs the specs asserting on log output.
    testImplementation libs.logback.classic
    // Retry for the HTTP client core (NFR-R2 of add-tracker-port) lives with the
    // core in `:githubapi`; the specs here build their own fast retry policies.
    // Declared last on purpose: declared ahead of the fixture and WireMock edges,
    // the resolution fetched the POM of slf4j-api 1.7.30 (resilience4j's own,
    // evicted request), which the dependency-verification metadata does not
    // carry, and every compile of this build failed verification.
    testImplementation libs.resilience4j.retry
    testImplementation libs.resilience4j.core
}

// PIT exclusions documented for THIS module (task 8.1: each module carries its
// own exceptions, next to the mutation scope they narrow). Moved here with the
// spec they name when task 10.1 carved the vendor bundle out of `:adapters`.
pitest {
    // M1/M2 documented exception (add-tracker-port / add-claim-heartbeat):
    // GithubTrackerContractSpec runs the full port contract against the real GitHub adapter
    // over WireMock, including the 12-way concurrent `claim` race (5 repetitions x 12 caller
    // threads on distinct issues). Under PIT's single-JVM coverage minion — every test class
    // loaded and instrumented together — that race is timing-sensitive: it intermittently
    // fails PIT's pre-mutation green-suite check, which PIT treats as a hard "suite not green"
    // abort rather than a mutation result. The spec is deterministically green under plain
    // `test`. Excluding it removes NO production line from mutation coverage: every Github*
    // class the contract exercises has its own dedicated unit spec feeding the gate
    // (GithubClaimLeaseSpec, GithubHeartbeatSpec, GithubStateWritesSpec, GithubCorrespondenceSpec,
    // GithubDecisionsSpec, GithubFeedQuerySpec, GithubTaskFetcherSpec, GithubOpenQuerySpec,
    // GithubStaleClaimRemovalSpec), and the composed GithubTracker by GithubTrackerSpec.
    excludedTestClasses = [
        'com.github.oinsio.gnomish.adapter.tracker.github.GithubTrackerContractSpec',
    ]
}

// A vendor adapter reaches the ports and use cases below it and nothing else
// (FR2, M4, design D1): no sibling adapter module appears here, which is what
// pass 2 buys over the package-level rule that stood in for it — a sibling's
// types are now simply absent from the compile classpath.
//
// The allow-list is down to the published contract, the domain and the
// dependency-free logging leaf (FR3 of close-plugin-api-compilability-gap; FR4 of
// harden-logging-observability): `:application` left with the
// `RecordedAttemptCommitWorkspace` downcast, and `:gitobjects` / `:sandbox:core`
// reached this module only through `:application`'s `api` edges, so they went with
// it. This list IS the "a third party could build this bundle" claim, checked by
// the build rather than asserted in prose.
layering {
    allowedProjects = [
        ':domain',
        ':gnomish-plugin-api',
        ':logtext',
        // The operator-event catalog leaf (FR4, FR11, design D3/D9 of split-logtext-leaves):
        // declared directly above, because this module's own log sites name `OperatorEvent`;
        // also reached through `:domain`, whose engine emitters take their head from it.
        ':operatorevent',
        // The pending-key leaf (design D20 of migrate-verify-to-executor-contract): transitive via
        // `:domain`, whose pending result and pending turn carry it. No source here names it.
        ':pendingkey',
        // The untrusted-text leaf (FR11, design D9 of split-logtext-leaves; FR3, design D2
        // of type-untrusted-text): reached through `:logtext`, whose `LogText` is a facade
        // over it, and now declared directly — this module mints the tracker family and names
        // the carrier on `ParsedMarker`'s own accessor.
        ':untrustedtext',
        // The first-party GitHub HTTP core (FR14, design D15 of
        // migrate-verify-to-executor-contract): the bundle's tracker is written against its
        // client, cache, rate-limit and retry, which left this bundle's `adapter.github` package
        // for a library the core-side GitHub built-ins share. Not the plugin api, and not a
        // sibling adapter: the library depends on `:domain` and the egress leaf only.
        ':githubapi',
        // The HTTP egress leaf (design D16 of migrate-verify-to-executor-contract): reached
        // through `:githubapi`, whose client runs over its guarded exchange. No production source
        // here names it since task 3.3 moved the check provider to `:adapters:scm`.
        ':httpegress',
    ]
}
