# Single source of dependency and plugin versions (design D2, NFR-R1 of add-project-skeleton).
# Spring-family dependency versions come from the Spring Boot BOM (design D3)
# and are therefore not declared here.
# Exception: the foojay-resolver-convention settings plugin version lives in
# settings.gradle, because the catalog is not available to the settings plugins block.
# All versions verified against Maven Central / Gradle Plugin Portal on 2026-07-14.

[versions]
java = "25"
# Strict: the Spring Boot BOM manages Groovy 5.x, which is incompatible with
# the stable Spock 2.4-groovy-4.0 line; the test stack must stay on Groovy 4.
groovy = { strictly = "4.0.32" }
# Spock groovy-4 variant, aligned with the Groovy 4 line (design risk: Gradle 9 / Groovy 4 / Spock matrix)
spock = "2.4-groovy-4.0"
spring-boot = "4.1.1"
# JaCoCo tool version for the core 'jacoco' Gradle plugin; 0.8.14+ supports Java 25 bytecode.
jacoco = "0.8.15"
# PIT: latest pinned for Java 25 bytecode support (design risk: PIT vs Java 25).
# Key is 'pitest-tool' (not 'pitest') so it doesn't collide with the
# pitest-* keys below as a catalog-accessor prefix (would force asProvider()).
pitest-tool = "1.25.7"
pitest-junit5-plugin = "1.2.3"
pitest-plugin = "1.19.0"
spotless = "8.10.0"
palantir-java-format = "2.96.0"
errorprone = "2.50.0"
errorprone-plugin = "5.1.0"
nullaway = "0.13.8"
jspecify = "1.0.1"
dependency-analysis = "3.18.0"
# japicmp Gradle plugin: binary-compatibility report over the published API
# contract (FR5, design D10 of split-into-modules). Report-only in this change;
# change B flips it to a failing gate.
japicmp-plugin = "0.4.6"
# ArchUnit for the domain/adapter purity gate (FR10 of load-pipeline-config,
# design D7). 1.5.0 verified on Maven Central 2026-08-13; its shaded ASM
# supports Java 25 bytecode (class-file version 69).
archunit = "1.5.0"
# WireMock for tracker/AI API contract tests, in-JVM, no Docker (.claude/rules/testing.md,
# NFR-R2 of add-tracker-port). 3.13.2 is the latest stable line on Maven Central (2026-07-28);
# 4.0.0 is still beta. Plain JDK artifact, so no JDK-version-specific classifier is needed.
wiremock = "3.13.2"
# WireMock 3.13.1's embedded Jetty stack (test scope). Pinned to the latest
# Maven Central release of the EOL Jetty 11 line and applied via an
# enforcedPlatform in build.gradle so WireMock gets one internally consistent
# Jetty 11 stack (the Boot BOM otherwise mixes 11/12 and startup fails — see
# build.gradle). 11.0.26 clears GHSA-mmxm-8w33-wc4h; the residual Jetty 11
# advisories have no Maven Central fix (Jetty 12 needs WireMock 4.x, still beta)
# and are accepted in osv-scanner.toml. Bump the whole stack by editing here.
jetty = "11.0.26"
# Resilience4j retry for the tracker adapter's HTTP client (NFR-R2 of add-tracker-port:
# infrastructure failures of tracker calls SHALL be retried). 2.4.0 verified on Maven
# Central 2026-07-28. `resilience4j-core` (IntervalFunction, used directly by
# GithubRetryConfig and its test) is a transitive of resilience4j-retry but
# buildHealth (task 4.4) requires it declared directly since production/test code
# references it, not just resilience4j-retry's own API surface.
resilience4j = "2.4.0"

# --- Security overrides of Spring Boot 4.1.0 BOM-managed versions ---
# No Spring Boot 4.1.x patch exists yet (Maven Central, 2026-07-15), so these
# CVE fixes are pinned here and applied via a platform import + constraints in
# build.gradle. Drop each once a Boot 4.1.x upgrade supersedes it.
# jackson: GHSA-5jmj-h7xm-6q6v / CVE-2026-54515 (jackson-databind case-insensitive
# @JsonIgnoreProperties deserialization bypass); 2.21.5 fixes the 2.19–2.21.4 line.
# 2.22.1 is the latest stable jackson-bom release on Maven Central (2026-07-28)
# and stays on the fixed line.
jackson = "2.22.2"
# logback: GHSA-jhq6-gfmj-v8fx (logback-core HardenedObjectInputStream Proxy
# injection, CVSS 2.9); fixed in 1.5.35. 1.6.1 is the latest stable release on
# Maven Central (2026-08-13) and stays on the fixed line. classic is kept on
# the same version.
logback = "1.6.3"
# httpcore5: GHSA-hf6x-8p5f-cgmf (CVSS 7.5) and GHSA-v3jc-474w-2wm6 on -h2;
# a WireMock/Testcontainers transitive drags in 5.4/5.4.2, fixed in 5.4.3. h2 is
# kept on the same version. Test-scope only (testCompileClasspath/testRuntimeClasspath).
# Applied from `test-conventions` so it reaches EVERY module, not just the one
# that first needed it (FR4, design D3 of fix-osv-dependency-gate).
httpcore5 = "5.4.3"
# httpclient5: GHSA-hjcp-jmpx-g3qm (CVSS 5.3); the Boot 4.1.0 BOM pins 5.6.1
# `strictly`, fixed in 5.6.3. Test-scope only (WireMock/Testcontainers
# transitive); the buildscript classpath carries its own copy of this override
# in gradle.properties, which cannot read this catalog. Applied by `force`, not
# a constraint — a `strictly` requirement cannot be raised by one (design D2).
# Drop once a Boot 4.1.x upgrade manages 5.6.3+.
httpclient5 = "5.6.4"
# log4j: GHSA-qv9r-c865-cp47 (CVSS 6.3) on log4j-api 2.25.4, fixed in 2.25.5.
# The ONE production-scope override here: log4j-to-slf4j (Boot's logging bridge)
# and its api sit on :bootstrap's runtimeClasspath/productionRuntimeClasspath,
# so NFR-S1 forbids suppressing it — it is pinned instead. Both artifacts must
# move together. Minimal patch on the line Boot 4.1.0 already manages rather
# than the newer 2.26.x line (design D4). Drop once a Boot 4.1.x upgrade
# manages 2.25.5+.
log4j = "2.26.1"

[libraries]
# Spring Boot BOM imported via platform() in build.gradle (design D3);
# spring-boot-starter deliberately has no version — it is BOM-managed.
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
# The bare Boot artifact: @ConfigurationProperties/@Name for the typed
# configuration records of `:sandbox:core`, which needs the annotations without
# a running context (design D3, D11 of split-into-modules). BOM-managed.
spring-boot = { module = "org.springframework.boot:spring-boot" }
# @AutoConfiguration: how an adapter module exports its `@Configuration` to the
# composition root explicitly, instead of being swept up by a component scan
# reaching across the module boundary (task 4.8, design D3 of
# split-into-modules). BOM-managed.
spring-boot-autoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure" }
# SLF4J API: production code logs through it (FR4); BOM-managed.
slf4j-api = { module = "org.slf4j:slf4j-api" }
# Logback backend classes (ListAppender, Logger) used by the logging-level
# spec to capture events; runtime copy already comes via spring-boot-starter.
# Version pinned above (security override of the Boot BOM); build.gradle also
# constrains the transitive runtime copies of both artifacts to match.
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
logback-core = { module = "ch.qos.logback:logback-core", version.ref = "logback" }
# httpcore5 / httpcore5-h2: security override of a WireMock/Testcontainers
# transitive (see [versions].httpcore5); constrained in build.gradle so both
# artifacts move together.
httpcore5 = { module = "org.apache.httpcomponents.core5:httpcore5", version.ref = "httpcore5" }
httpcore5-h2 = { module = "org.apache.httpcomponents.core5:httpcore5-h2", version.ref = "httpcore5" }
# httpclient5: security override of the same WireMock/Testcontainers transitive
# stack (see [versions].httpclient5); forced alongside httpcore5 in
# `test-conventions`.
httpclient5 = { module = "org.apache.httpcomponents.client5:httpclient5", version.ref = "httpclient5" }
# log4j-api / log4j-to-slf4j: production-scope security override of the Boot BOM
# (see [versions].log4j); constrained in bootstrap/build.gradle so both
# artifacts move together, as logback-core/-classic already do.
log4j-api = { module = "org.apache.logging.log4j:log4j-api", version.ref = "log4j" }
log4j-to-slf4j = { module = "org.apache.logging.log4j:log4j-to-slf4j", version.ref = "log4j" }
# @SpringBootTest and Boot test-context support for context-level specs; BOM-managed.
spring-boot-test = { module = "org.springframework.boot:spring-boot-test" }
# @ContextConfiguration and the TestContext framework (spock-spring's Spring side); BOM-managed.
spring-test = { module = "org.springframework:spring-test" }
# @Autowired lives in spring-beans; specs compile against it directly, so it is
# declared directly per the buildHealth advice (FR10); BOM-managed.
spring-beans = { module = "org.springframework:spring-beans" }
groovy = { module = "org.apache.groovy:groovy", version.ref = "groovy" }
# Gradle 9 no longer injects the launcher; version is Boot-BOM-managed.
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
# junit-platform-engine: `:test-fixtures` publishes Spock Specification subclasses
# as main-scope classes, so the engine types Spock's base class touches must be on
# the consumer's runtime classpath by an explicit declaration (buildHealth advice,
# FR7 of split-into-modules); JUnit-BOM-managed.
junit-platform-engine = { module = "org.junit.platform:junit-platform-engine" }
# opentest4j: the port-contract opt-out seam (PortContractSupport) throws
# TestAbortedException for a runtime, per-variant skip on the JUnit Platform
# (FR14 of add-manual-run) — a direct source reference, so the
# dependency-analysis gate requires it declared directly; JUnit-BOM-managed.
opentest4j = { module = "org.opentest4j:opentest4j" }
spock-core = { module = "org.spockframework:spock-core", version.ref = "spock" }
spock-spring = { module = "org.spockframework:spock-spring", version.ref = "spock" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }
nullaway = { module = "com.uber.nullaway:nullaway", version.ref = "nullaway" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
# Plain artifact, not archunit-junit5: the rules are asserted inside Spock
# specs via ArchRule.check(...) (design D7), so the JUnit @AnalyzeClasses
# runner and its extra engine wiring are unnecessary.
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }
# Testcontainers core: GenericContainer + DockerClientFactory.isDockerAvailable() for the Gitea
# E2E fixture (task 6.5 of add-git-workflow). Version is Spring Boot BOM-managed (4.1.0 -> 2.0.5).
# No JUnit/Spock integration module is declared — the fixture manages container lifecycle itself
# (setupSpec/cleanupSpec), matching this project's existing hand-rolled fixture style
# (BareGitRepoFixture, E2eProcessHarness).
testcontainers = { module = "org.testcontainers:testcontainers" }
# WireMock standalone server, embedded in-JVM (design: no Docker for HTTP contract tests).
wiremock = { module = "org.wiremock:wiremock", version.ref = "wiremock" }
# Jetty 11 BOM, imported as an enforcedPlatform on the test classpaths to pin
# WireMock's transitive Jetty stack to one consistent version (see [versions].jetty).
jetty-bom = { module = "org.eclipse.jetty:jetty-bom", version.ref = "jetty" }
# Resilience4j retry: the GitHub tracker adapter's HTTP client core (task 4.4 of
# add-tracker-port) wraps java.net.http calls in a Retry decorator.
resilience4j-retry = { module = "io.github.resilience4j:resilience4j-retry", version.ref = "resilience4j" }
# Resilience4j core: IntervalFunction (exponential backoff), referenced directly
# by GithubRetryConfig (production) and GithubHttpClientSpec (test), not just
# transitively via resilience4j-retry.
resilience4j-core = { module = "io.github.resilience4j:resilience4j-core", version.ref = "resilience4j" }
# Jackson for the .gnomish/ YAML loader in the adapter layer ONLY (FR1 of
# load-pipeline-config, design D1/D2 — the domain stays Jackson-free, guarded
# by ArchUnit). Boot 4.1.0's jackson-2-bom manages the 2.x line; all four are
# BOM-managed. jackson-annotations (@JsonTypeInfo/@JsonSubTypes on the sealed
# DTO families) and jackson-core (JsonFactory, extended by YAMLFactory) are
# compiled against directly, so the dependency-analysis gate requires them
# declared directly alongside databind + dataformat-yaml.
# jackson-bom pinned to the CVE fix (see [versions].jackson) and imported as a
# platform in build.gradle so the whole Jackson family overrides the Boot BOM's
# 2.21.4 consistently — the four artifacts below stay version-less (BOM-managed).
jackson-bom = { module = "com.fasterxml.jackson:jackson-bom", version.ref = "jackson" }
jackson-annotations = { module = "com.fasterxml.jackson.core:jackson-annotations" }
jackson-core = { module = "com.fasterxml.jackson.core:jackson-core" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind" }
jackson-dataformat-yaml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
pitest = { id = "info.solidsoft.pitest", version.ref = "pitest-plugin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
errorprone = { id = "net.ltgt.errorprone", version.ref = "errorprone-plugin" }
dependency-analysis = { id = "com.autonomousapps.dependency-analysis", version.ref = "dependency-analysis" }
japicmp = { id = "me.champeau.gradle.japicmp", version.ref = "japicmp-plugin" }
